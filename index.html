<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DK Price Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🇩🇰 Price Checker</h1>
  </header>
  <section class="controls">
    <div class="row">
      <input id="sheetUrl" type="text" placeholder="Paste Google Sheet URL or ID" />
      <button id="loadBtn">Load</button>
    </div>
    <div class="row">
      <span id="sheetTitle"></span>
      <select id="tabSelect"></select>
      <label><input id="skipPriced" type="checkbox" checked /> Skip items already checked today</label>
    </div>
    <div class="row">
      <button id="runBtn" class="primary" disabled>▶ Find prices</button>
      <button id="stopBtn" disabled>⏹ Stop</button>
      <span id="status"></span>
    </div>
  </section>
  <table id="itemsTable">
    <thead>
      <tr>
        <th>Row</th>
        <th>Item</th>
        <th>Status</th>
        <th>Price (DKK)</th>
        <th>Shop</th>
        <th>Matched product</th>
        <th>Conf.</th>
        <th>Checked</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
